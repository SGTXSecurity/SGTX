<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGTX 보안 아이템 거래소</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-blue: #0066cc;
            --light-blue: #f0f7ff;
            --bg-white: #ffffff;
            --text-dark: #1a1a1a;
            --text-gray: #6c757d;
            --border-soft: #e9ecef;
        }

        body {
            background-color: #ffffff;
            font-family: 'Inter', -apple-system, 'Malgun Gothic', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
        }

        .navbar { 
            background-color: var(--bg-white); 
            border-bottom: 1px solid var(--border-soft);
            padding: 1.2rem 0;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--primary-blue) !important;
            letter-spacing: -0.5px;
        }

        .hero-section { 
            padding: 100px 0 60px 0;
            background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
        }

        .hero-title {
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .container {
            max-width: 1000px;
        }

        /* Ticker Style */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: var(--light-blue);
            padding: 12px 0;
            border-top: 1px solid var(--border-soft);
            border-bottom: 1px solid var(--border-soft);
        }

        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 30s linear infinite;
            color: var(--primary-blue);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .item-card { 
            border: 1px solid var(--border-soft); 
            border-radius: 12px; 
            background: var(--bg-white); 
            padding: 2rem;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .item-card:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.05);
        }

        .item-visual {
            height: 160px;
            background-color: var(--light-blue);
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .price-tag { 
            color: var(--primary-blue); 
            font-weight: 700; 
            font-size: 1.4rem; 
        }

        .btn-primary {
            background-color: var(--primary-blue);
            border: none;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            border-radius: 6px;
        }

        .section-title { 
            font-weight: 700;
            margin-bottom: 2.5rem;
        }

        .hacker-mode-section { 
            background-color: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            margin-top: 1.5rem; 
            display: none; 
            border: 1px solid #dee2e6;
        }

        .form-select, .form-control {
            font-size: 0.9rem;
            padding: 0.6rem;
        }

        .modal-content {
            border-radius: 16px;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .nav-pills .nav-link.active {
            background-color: var(--primary-blue);
        }

        .spacing-y { margin-bottom: 4rem; }
    </style>
</head>
<body>

<nav class="navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" href="#">SGTX SECURE MARKET</a>

        <div class="d-flex align-items-center gap-3">
            <div class="form-check form-switch me-2">
                <input class="form-check-input" type="checkbox" id="hackerModeToggle" onchange="toggleHackerMode()">
                <label class="form-check-label small fw-bold text-muted" for="hackerModeToggle">개발자 모드</label>
            </div>

            <select id="userSelector" class="form-select form-select-sm" style="width: 160px;">
                <option value="user1">사용자 A (구매자)</option>
                <option value="user2">사용자 B (판매자)</option>
                <option value="hacker">해커 (공격자)</option>
            </select>

            <select id="roleSelector" class="form-select form-select-sm" style="width: 130px;" onchange="changeRoleView()">
                <option value="consumer">구매자 화면</option>
                <option value="cardCompany">카드사 화면</option>
                <option value="buyer">판매자 화면</option>
            </select>
        </div>
    </div>
</nav>

<div class="hero-section text-center">
    <div class="container">
        <h1 class="hero-title"> 게임 아이템 거래</h1>
        <p class="text-muted lead">AES-256 및 RSA 프로토콜을 통한 무결성 검증 시스템</p>
    </div>
</div>

<div class="ticker-wrap spacing-y">
    <div class="ticker">
        AES-256 CBC 암호화 거래 지원 • RSA 전자봉투 보안 적용 • SHA-256 데이터 무결성 실시간 검증 • 카드 결제 보안 모듈 탑재 • 게임 아이템 안전 거래 자동화 시스템 가동 중
    </div>
</div>

<div class="container">
    <div class="card border-0 shadow-sm spacing-y p-4" id="consumerCardSection" style="border-radius: 12px;">
        <div class="card-body">
            <h6 class="fw-bold mb-4 text-uppercase tracking-wider">결제 수단 등록</h6>
            <div class="row g-3">
                <div class="col-md-3"><input id="cardUserId" class="form-control" placeholder="사용자 ID"></div>
                <div class="col-md-3"><input id="cardCompany" class="form-control" placeholder="카드사"></div>
                <div class="col-md-4"><input id="cardNumber" class="form-control" placeholder="카드 번호"></div>
                <div class="col-md-2"><button class="btn btn-primary w-100" onclick="registerCard()">등록하기</button></div>
            </div>
        </div>
    </div>

    <div id="cardCompanySection" style="display:none;" class="spacing-y">
        <div class="card border-0 shadow-sm p-4" style="border-radius: 12px;">
            <div class="card-body">
                <h6 class="fw-bold mb-4 text-uppercase">카드사 감사 패널</h6>
                <div class="d-flex gap-2">
                    <input id="cardSearchUserId" class="form-control w-25" placeholder="사용자 ID 조회">
                    <button class="btn btn-primary" onclick="getCompanyCards()">감사 실행</button>
                </div>

                <div id="companyCardResult" class="mt-4"></div>
            </div>
        </div>
    </div>

    <div id="itemSection" class="spacing-y">
        <h4 class="section-title text-uppercase small tracking-widest text-muted">마켓플레이스</h4>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="item : ${items}">
                <div class="item-card">
                    <div class="item-visual"></div>
                    <div class="card-body p-0 d-flex flex-column h-100">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title mb-0" th:text="${item.itemName}">아이템 이름</h5>
                        </div>
                        <p class="text-muted small mb-4">암호화 프로토콜로 보호되는 안전한 거래 자산입니다.</p>
                        <div class="d-flex justify-content-between align-items-center mt-auto">
                            <span class="price-tag">50,000 KRW</span>
                            <button class="btn btn-primary btn-sm" th:attr="onclick=|startPurchaseFlow(${item.itemId}, 50000)|">
                                거래 시작
                            </button>
                        </div>
                        <div class="hacker-mode-section">
                            <p class="small fw-bold text-danger mb-2">공격 샌드박스</p>
                            <div class="d-grid gap-2">
                                <button class="btn btn-sm btn-outline-danger" onclick="forcePayment()">검증 우회</button>
                                <button class="btn btn-sm btn-outline-dark" onclick="stealReceipt()">IDOR 탈취</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="eduModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="fw-bold" id="modalTitle">프로토콜 분석</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
                    <li class="nav-item"><button class="nav-link active" id="pills-user-tab" data-bs-toggle="pill" data-bs-target="#pills-user" type="button">사용자 화면</button></li>
                    <li class="nav-item"><button class="nav-link" id="pills-api-tab" data-bs-toggle="pill" data-bs-target="#pills-api" type="button">API 인스펙터</button></li>
                    <li class="nav-item"><button class="nav-link" id="pills-security-tab" data-bs-toggle="pill" data-bs-target="#pills-security" type="button">보안 인사이트</button></li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="pills-user"><div id="userExperienceContent" class="text-center py-5"></div></div>
                    <div class="tab-pane fade" id="pills-api"><div id="apiInspectorContent"></div></div>
                    <div class="tab-pane fade" id="pills-security"><div id="securityInsightContent"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
